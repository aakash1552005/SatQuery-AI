[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Pytest configuration and warning governance
# SECTION 22 AUDIT COMPLIANCE:
# WARNING_SOURCE: starlette.testclient (invoked by fastapi.testclient.TestClient)
# WHY_SUPPRESSED: FastAPI TestClient imports Starlette's TestClient which emits a deprecation
#                 advisory regarding httpx transport in upcoming Starlette major versions.
# DEPENDENCY_VERSION: fastapi==0.110.0, starlette>=0.37.0, httpx>=0.27.0
# WHY_IT_IS_SAFE: This is an upstream compatibility advisory between FastAPI and Starlette test harnesses.
#                 It does not alter runtime server behavior, API endpoints, or test correctness.
#                 Suppression is documented and governed here rather than silently hidden.
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning

