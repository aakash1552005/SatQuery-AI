name: SatQuery CI & Verification

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies (CPU Wheels)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install lightweight CPU torch for fast CI execution
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          # Install dependencies with binary wheel preference
          pip install --prefer-binary -r requirements.txt
          pip install pytest pytest-cov
          # Install local package in editable mode
          pip install -e .

      - name: Generate Synthetic Validation Data
        run: |
          python scripts/generate_test_data.py

      - name: Run 14 Milestone Test Suites (118 Tests)
        run: |
          python -m pytest tests/ -v --durations=10

  build-package:
    name: Build Python Distribution Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install build twine

      - name: Build Package (Wheel & Sdist)
        run: |
          python -m build

      - name: Verify Package Metadata
        run: |
          twine check dist/*

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satquery-package
          path: dist/

  release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-package]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: satquery-package
          path: dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "🛰️ Release v1.0.0 — Production Architecture Freeze (SIH 2026 PS 26167)"
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
